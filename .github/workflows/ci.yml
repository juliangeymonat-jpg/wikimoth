name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest

  acceptance:
    name: released-artifact acceptance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - name: Build sdist + wheel
        run: python -m build
      - name: Install the built wheel in a CLEAN venv and run the documented surface
        # Guards against shipping a broken console script, a dead MCP server, or
        # version drift: everything is exercised against the RELEASED artifact.
        run: |
          set -euo pipefail
          python -m venv /tmp/acc
          /tmp/acc/bin/pip install --upgrade pip
          /tmp/acc/bin/pip install dist/*.whl
          /tmp/acc/bin/wikimoth --version
          /tmp/acc/bin/python -m wikimoth --help
          /tmp/acc/bin/python tests/mcp_acceptance.py
          /tmp/acc/bin/python tests/test_entry_points.py
          /tmp/acc/bin/python tests/test_version_sync.py
