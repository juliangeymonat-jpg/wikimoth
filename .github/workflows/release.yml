name: release

# Tag-triggered release. Before anything publishes: the tag must match the
# package version, the unit test suite must pass, and the built wheel must
# survive the same released-artifact acceptance gate CI runs (via the shared
# scripts/acceptance.sh, so the two gates cannot drift).
#
# Publish uses Trusted Publishing (OIDC) on BOTH registries, no stored tokens.
# One-time setup:
# - PyPI: project -> Manage -> Publishing -> add a GitHub Actions publisher
#   (owner: juliangeymonat-jpg, repo: wikimoth, workflow: release.yml,
#   environment: pypi).
# - npm: package wikimoth-mcp -> Settings -> Trusted Publisher -> GitHub Actions
#   (organization or user: juliangeymonat-jpg, repository: wikimoth,
#   workflow filename: release.yml, environment: npm).
# Until then, only the publish jobs are blocked; build-verify still gates.
#
# Publish ordering makes a half-release hard: npm (reversible -- unpublishable
# within 72h / deprecatable) ships FIRST, and PyPI (immutable -- a version can
# never be re-uploaded) only runs if npm succeeded. So an npm/OIDC failure
# blocks PyPI entirely instead of stranding an immutable PyPI-only release.

on:
  push:
    tags: ["v*"]

# Least privilege by default; each publish job escalates to id-token: write.
permissions:
  contents: read

# One release pipeline per tag at a time: a deleted-and-re-pushed tag can't
# race a still-running publish. Do NOT cancel-in-progress (cancelling mid-
# publish is riskier than serializing).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verify:
    name: build + released-artifact acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check the tag matches the package version
        run: |
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$VER" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version v$VER"; exit 1
          fi
      - run: python -m pip install --upgrade pip build
      - name: Unit tests (source)
        run: |
          pip install -e ".[dev]"
          pytest
      - name: Build sdist + wheel
        run: python -m build
      - name: Install the built wheel in a clean venv and run the documented surface
        run: bash scripts/acceptance.sh /tmp/rel
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # npm first: it is the reversible registry. If it fails, PyPI never runs.
  publish-npm:
    name: publish launcher to npm (trusted publishing)
    needs: build-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check the tag matches the launcher version
        run: |
          VER=$(node -p "require('./npm/package.json').version")
          if [ "v$VER" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match npm/package.json v$VER"; exit 1
          fi
      - name: Ensure npm >= 11.5.1 (required for OIDC trusted publishing)
        run: |
          # node 24 already ships a recent npm; only upgrade (to a pinned floor,
          # not a moving `@latest`) if it is below the OIDC-capable minimum.
          need=11.5.1
          have=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
            npm install -g 'npm@^11.5.1'
          fi
          npm --version
      - run: node --check npm/bin.js
      - name: Publish (OIDC, provenance automatic)
        run: npm publish
        working-directory: npm

  # PyPI last: immutable. Only ships once npm has succeeded, so a broken npm
  # publish can never strand an un-retractable PyPI-only release.
  publish:
    name: publish to PyPI (trusted publishing)
    needs: [build-verify, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-run on an already-published tag skips the existing distribution
          # instead of hard-failing on "400 File already exists".
          skip-existing: true
